<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashy</title>
<style>
  :root{color-scheme:light dark;--bg:#fafaf8;--fg:#1a1a18;--muted:#6b6b66;--line:#d8d8d2;--chip:#efefea}
  @media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#f1f1ee;--muted:#9a9a94;--line:#3a3a36;--chip:#26261f}}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
  #avatar{width:min(320px,80vw);aspect-ratio:1}
  .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px}
  button{font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
  button[aria-pressed="true"]{background:var(--chip)}
  small{color:var(--muted)}
</style>
</head>
<body>
  <div id="avatar"></div>
  <div class="row" id="shape"></div>
  <div class="row" id="status"></div>
  <div class="row" id="mood"></div>
  <small>Beweeg je muis. Klik op Dashy om hem te porren.</small>
  <!--BUNDLE-->
</body>
</html>
