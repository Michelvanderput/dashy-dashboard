<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#e8e6e0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#080809" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Dashy" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>Dashy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect x=%2710%27 y=%2710%27 width=%2780%27 height=%2780%27 rx=%2718%27 fill=%27%23fff%27 stroke=%27%23ccc%27/%3E%3Crect x=%2732%27 y=%2736%27 width=%2711%27 height=%2724%27 rx=%275.5%27 fill=%27%23101214%27/%3E%3Crect x=%2757%27 y=%2736%27 width=%2711%27 height=%2724%27 rx=%275.5%27 fill=%27%23101214%27/%3E%3C/svg%3E" />
  <style>
:root{--bg:#e8e6e0;--card:#f4f3ee;--ink:#17181a;--line:rgba(23,24,26,.24)}
@media (prefers-color-scheme:dark){:root{--bg:#080809;--card:#121214;--ink:#eeece8;--line:rgba(255,255,255,.2)}}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 1rem/1.45 "Geist Variable",system-ui,sans-serif}
html,body{transition:background-color .8s ease,color .8s ease}
/* free time (after the working day, days off): warmer */
:root[data-mode="free"]{--bg:#f1e5d6;--card:#f9f0e4;--ink:#2b1e13;--line:rgba(43,30,19,.24)}
@media (prefers-color-scheme:dark){:root[data-mode="free"]{--bg:#18110b;--card:#211812;--ink:#f4e9dc;--line:rgba(244,233,220,.2)}}
@media (prefers-reduced-motion:reduce){html,body{transition:none}}
/* kiosk (?kiosk=1): a screen to look at, not to touch */
html.kiosk,html.kiosk *{cursor:none!important}
html.kiosk{font-size:clamp(16px,2.4vmin,32px)}
/* the page: a header (clock and weather), then Dashy with the day on the left, the tasks and the music on the right */
.dash{display:grid;gap:clamp(14px,2.2vmin,26px);min-height:100dvh;align-content:start;max-width:1200px;margin:0 auto;box-sizing:border-box;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-areas:"head head" "left tasks" "left music" "foot foot"}
.dash.nomusic{grid-template-areas:"head head" "left tasks" "foot foot"}
.dash-head{grid-area:head;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 32px}
.dash-left{grid-area:left;display:grid;align-content:start;justify-items:center;gap:clamp(10px,2vmin,22px);min-width:0}
.dash-avatar{display:grid;place-items:center;width:100%;min-height:0}
.dash-day{display:grid;justify-items:center;width:100%}
.dash-tasks{grid-area:tasks;min-width:0}
.dash-music{grid-area:music;align-self:start}
.dash-foot{grid-area:foot;display:flex;flex-wrap:wrap;gap:4px 20px;justify-content:center;align-items:center;font-size:.8rem;opacity:.7}
@media (max-width:820px){.dash,.dash.nomusic{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "tasks" "left" "music" "foot"}.dash.nomusic{grid-template-areas:"head" "tasks" "left" "foot"}}
@media (max-height:520px) and (min-width:700px){.dash{grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr) minmax(0,.8fr);grid-template-areas:"head head head" "left tasks music" "foot foot foot"}.dash.nomusic{grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);grid-template-areas:"head head" "left tasks" "foot foot"}.dash-music{align-self:center}}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.dash-left,.dash-tasks{min-height:0;overflow:hidden}
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
