<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#e8e6e0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#080809" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Dashy" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>Dashy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect x=%2710%27 y=%2710%27 width=%2780%27 height=%2780%27 rx=%2718%27 fill=%27%23fff%27 stroke=%27%23ccc%27/%3E%3Crect x=%2732%27 y=%2736%27 width=%2711%27 height=%2724%27 rx=%275.5%27 fill=%27%23101214%27/%3E%3Crect x=%2757%27 y=%2736%27 width=%2711%27 height=%2724%27 rx=%275.5%27 fill=%27%23101214%27/%3E%3C/svg%3E" />
  <style>
:root{--bg:#e8e6e0;--card:#f4f3ee;--ink:#17181a;--line:rgba(23,24,26,.24)}
@media (prefers-color-scheme:dark){:root{--bg:#080809;--card:#121214;--ink:#eeece8;--line:rgba(255,255,255,.2)}}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 1rem/1.45 "Geist Variable",system-ui,sans-serif}
html,body{transition:background-color .8s ease,color .8s ease}
/* free time (after the working day, days off): warmer */
:root[data-mode="free"]{--bg:#f1e5d6;--card:#f9f0e4;--ink:#2b1e13;--line:rgba(43,30,19,.24)}
@media (prefers-color-scheme:dark){:root[data-mode="free"]{--bg:#18110b;--card:#211812;--ink:#f4e9dc;--line:rgba(244,233,220,.2)}}
@media (prefers-reduced-motion:reduce){html,body{transition:none}}
/* kiosk (?kiosk=1): a screen to look at, not to touch */
html.kiosk,html.kiosk *{cursor:none!important}
html.kiosk{font-size:clamp(16px,2.4vmin,32px)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
