# Builds the desktop app (Tauri 2) for Windows and macOS. Run by hand from the Actions tab, or by pushing a tag like v0.1.0.
# Not verified on those platforms yet: the first run may need small fixes (see docs/PLATFORMS.md).
name: desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '' }
          - { os: macos-latest, args: '--target universal-apple-darwin' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        with:
          args: ${{ matrix.args }}
          releaseDraft: true
          tagName: ${{ github.ref_name }}
          releaseName: 'Dashy ${{ github.ref_name }}'
